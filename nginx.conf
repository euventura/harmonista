server {
    server_name harmonista.org *.harmonista.org;

    # Gzip compression
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json text/xml application/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Static files with cache
    location /public/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/harmonista.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/harmonista.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = harmonista.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name harmonista.org *.harmonista.org;
    return 404; # managed by Certbot


}