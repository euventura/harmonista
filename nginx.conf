server {
    listen 80;
    server_name harmonista.org *.harmonista.org;

    # Gzip compression
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json text/xml application/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Static files with cache
    location /public/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
