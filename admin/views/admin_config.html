{{ template "admin_header.html" .}}

<section>
    <h2>Configurações</h2>
    <form action="/admin/{{.subdomain}}/config" method="POST">
        <fieldset>
            <label for="subdomain" class="width">
                Endereço
                <input type="text" id="subdomain" name="subdomain" value="" required>
                <small>harmonista.org/@/{{.blog.Subdomain}}</small>
            </label>

            <label>
                <input type="checkbox" name="isAdult" value="1" {{if .blog.IsAdult}}checked{{end}}>
                Meu blog possui conteúdo sensivel a menores de idade
            </label>
            <label>
                <input type="checkbox" name="IsListReader" value="1" {{if .blog.IsListReader}}checked{{end}}>
                Quero meu blog listado na lista de leitura
            </label>
        </fieldset>

        <fieldset>
            <label for="password" class="width">
                Atualizar senha
                <input type="password" id="password" name="password">

            </label>
        </fieldset>

        <button type="submit">Salvar</button>
    </form>
</section>

<section>
    <h2>Página Inicial</h2>
    <form action="/admin/{{.subdomain}}/config" method="POST">
        <label for="title" class="width">
            Título do Blog
            <input type="text" id="title" name="title" value="{{if .blog}}{{.blog.Title}}{{end}}" required>
        </label>

        <label for="description">
            Página inicial (<a href="https://markdown.net.br/referencia-rapida/" target="_blank">Markdown</a>)
            <textarea id="description" name="description" placeholder="Texto da página inicial" rows="25"></textarea>
        </label>

        <button type="submit">Salvar</button>
    </form>
</section>

{{ template "tinymde_component.html" .}}

<script>
    const easyMDEManager = new EasyMDEManager({
        textareaId: 'description',
        autoSaveUrl: null
    });

    {{if .blog}}
        {{if .blog.Description}}
            easyMDEManager.setContent('{{.blog.Description}}');
        {{end}}
    {{end}}
</script>

{{ template "admin_footer.html" .}}
